# Testcontainers provides the database; these satisfy the placeholders in
# application.properties, they are not used to connect.
DB_CONNECTION_STRING=unused
DB_USERNAME=test
DB_PASSWORD=test

spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.url=jdbc:tc:postgresql:15.3-alpine:///?currentSchema=wiki

sita.backend.http.enabled=false
sita.bot.alerting.enabled=false
sita.wiki.poll.auto-close.enabled=false
