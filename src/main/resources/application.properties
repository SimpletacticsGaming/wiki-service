spring.config.import=optional:configtree:/run/secrets/
spring.application.name=wiki-service
# ==============================================================
# = Inbound auth for sita-backend (see application-secrets.md)
# ==============================================================
sita.backend.http.enabled=true
sita.backend.http.auth-token-header-name=authentication
sita.backend.http.auth-token=${WIKI_SERVICE_AUTH_TOKEN:}
# ==============================================================
# = Data Source
# ==============================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_CONNECTION_STRING}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# ==============================================================
# = Hikari pool (all durations in milliseconds)
# ==============================================================
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
# ==============================================================
# = Flyway
# ==============================================================
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=wiki
spring.flyway.default-schema=wiki
# ==============================================================
# = JSON
# ==============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
# ==============================================================
# = Actuator / prometheus metrics
# ==============================================================
management.endpoint.health.access=read_only
management.endpoint.metrics.access=read_only
management.endpoint.prometheus.access=read_only
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# ==============================================================
# = OpenAPI - off by default, enabled per profile
# ==============================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# ==============================================================
# = Colored Output
# ==============================================================
spring.output.ansi.enabled=ALWAYS
# ==============================================================
# = Alerting
# ==============================================================
sita.bot.alerting.enabled=true
sita.bot.alerting.url=${SITA_BOT_ALERTING_URL:}
sita.bot.alerting.channel-id=${SITA_BOT_ALERTING_CHANNEL_ID:}
# ==============================================================
# = Scheduled jobs
# ==============================================================
sita.wiki.poll.auto-close.enabled=true
sita.wiki.poll.auto-close.cron=0 5 0 * * *
