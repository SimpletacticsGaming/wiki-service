# Builds and tests the jar at a given version, and leaves it as an artifact for
# publish-image.yml. Reused by pipeline.yml and cut-rc.yml so a release candidate is
# built exactly the way a dev build is.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: "Commit or tag to build. Defaults to the triggering ref."
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          ORG_GRADLE_PROJECT_nexusSnapshotUrl: ${{ secrets.NEXUS_SNAPSHOT_URL }}
          ORG_GRADLE_PROJECT_nexusUrl: ${{ secrets.NEXUS_URL }}
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.NEXUS_USER }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
        run: >-
          ./gradlew clean build -x test
          -PprojVersion=${{ inputs.version }}
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wiki-service-jar
          path: build/libs/wiki-service.jar
          retention-days: 7

  # Runs before anything is published: a broken build must never reach the registry.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        env:
          ORG_GRADLE_PROJECT_nexusSnapshotUrl: ${{ secrets.NEXUS_SNAPSHOT_URL }}
          ORG_GRADLE_PROJECT_nexusUrl: ${{ secrets.NEXUS_URL }}
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.NEXUS_USER }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
        run: >-
          ./gradlew test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests
          retention-days: 7
